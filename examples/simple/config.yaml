# Simplest possible brahma config: two independent pipelines, each
# running the same "fake jobs" worker. Run it from the repo root:
#
#   brahma examples/simple/config.yaml
#   chitra --watch 2s          # in another terminal
#
# `alpha` keeps two workers busy at once; `beta` keeps one. Together
# they show pool sizing, lazy fill, and how succeeded/failed outcomes
# land in the journal and roll up per pipeline in chitra.

state_dir: ~/.local/state/brahmanda-demo
log_file: ""    # empty = stderr

# Global cap on workers running at once across ALL pipelines. Slots are
# handed out round-robin; each pipeline still never exceeds its own
# pool_size. Here alpha (2) + beta (1) fit under the cap of 3; lower it
# to 2 to watch the pipelines take turns sharing the pool.
max_workers: 3

# Optional rolling spend caps ("<amount>USD/h" or "<amount>USD/d"), summed
# from the cost_usd workers report on their journal events. A pipeline at
# its cap is skipped — no error — until enough spend ages out of the
# window. The demo workers report no cost, so these never trigger here.
# budget: 40USD/d

pipelines:
  - name: alpha
    pool_size: 2
    tick_interval: 5s
    step_timeout: 30s
    # budget: 4USD/h
    command: ./examples/simple/worker.sh

  - name: beta
    pool_size: 1
    tick_interval: 8s
    step_timeout: 30s
    command: ./examples/simple/worker.sh
